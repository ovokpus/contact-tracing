[project]
name = "contact-tracing"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
  "elasticsearch>=8.15,<9",
  "faker>=30",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
