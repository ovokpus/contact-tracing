x-es-env: &es-env
  ES_URL: http://elasticsearch:9200
  SCANS_INDEX: ${SCANS_INDEX:-app_scans}
  BUSINESSES_INDEX: ${BUSINESSES_INDEX:-businesses}

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"   # local demo only, as in the original project
      ES_JAVA_OPTS: -Xms${ES_HEAP:-768m} -Xmx${ES_HEAP:-768m}
    ulimits:
      memlock: {soft: -1, hard: -1}
      nofile: {soft: 65536, hard: 65536}
    volumes: [es-data:/usr/share/elasticsearch/data]
    ports: ["${ES_PORT:-9200}:9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"]
      interval: 5s
      retries: 40

  seed:
    build: .
    image: contact-tracing/app:local
    command: ["python", "-m", "tracer.seed"]
    environment:
      <<: *es-env
      SYNTH_BUSINESSES: ${SYNTH_BUSINESSES:-600}
      SYNTH_PEOPLE: ${SYNTH_PEOPLE:-2500}
      SYNTH_DAYS: ${SYNTH_DAYS:-3}
      RESEED: ${RESEED:-0}
    depends_on:
      elasticsearch: {condition: service_healthy}

  api:
    image: contact-tracing/app:local
    environment: *es-env
    ports: ["${API_PORT:-8000}:8000"]
    depends_on:
      seed: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      retries: 20

  frontend:
    build: ./frontend
    ports: ["${FRONTEND_PORT:-8080}:80"]
    depends_on:
      api: {condition: service_healthy}

  kibana:   # optional: docker compose --profile kibana up
    image: docker.elastic.co/kibana/kibana:8.15.3
    profiles: [kibana]
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports: ["${KIBANA_PORT:-5601}:5601"]
    depends_on:
      elasticsearch: {condition: service_healthy}

volumes:
  es-data:
